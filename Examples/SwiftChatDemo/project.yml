name: SwiftChatDemo
options:
  bundleIdPrefix: com.unionst
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  swift-chat:
    url: https://github.com/unionst/swift-chat.git
    from: 1.0.2
targets:
  SwiftChatDemo:
    type: application
    platform: iOS
    sources:
      - SwiftChatDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unionst.SwiftChatDemo
        PRODUCT_NAME: SwiftChatDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Swift Chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: swift-chat
        product: SwiftChat
